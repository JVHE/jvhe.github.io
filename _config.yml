about_content: |
  **문제를 분석하고, 해결하는 과정에 보람을 느끼는 6년차 개발자 이정배입니다.**

    1년 6개월간 클라우드 EMR(전자의무기록) 기업의 Spring Boot 기반 MSA 환경에서 Kafka, Elasticsearch 중심의 데이터 파이프라인을 설계하고 운영했습니다. 민감 의료 데이터를 다루는 환경에서 검색엔진 전환, 서비스 간 데이터 동기화, 환자 정보 전달 등을 담당했습니다.
    기술 도입 시에는 직관에 의존하지 않고 로그 기반 시뮬레이션으로 효용을 검증한 뒤 판단하는 방식으로 일했습니다.
    분산 환경에서 발생할 수 있는 병목을 고려하여 실용적인 구조를 추구합니다.  

    이전에는 목표관리 앱 'Dreamfora'에 2번째 직원으로 합류하여 100만 다운로드까지 4년간 클라이언트 개발을 주도했고, 7개월간 큐레이팅 컨텐츠 관리 어드민을 직접 설계하고 운영했습니다.

content:
  - title: 경력 사항
    layout: list
    content:
      - layout: left
        title: Cenacle
        sub_title: 백엔드 개발(서비스개발 1팀)
        caption: 2023.07 - 2024.12
        description: |
          - **[다운타임 0초]** PaaS 제약 극복을 위한 Elasticsearch 클러스터 자체 구축 및 상용 서비스 무중단 마이그레이션 완수
          - **[이벤트 노이즈 제거]** Kafka 토픽 도메인 격리 및 관심사 재정의로 불필요한 동기화 이벤트 99% 감소, 연관 DB 갱신 96% 축소
          - **[데이터 반영 3분 → 수 초]** Kafka Broadcast 기반 캐시 무중단 동기화
          - **[오버엔지니어링 방어]** 상용 로그 시뮬레이션 기반 캐시 효용성 검증(Hit Rate 20% 미만) 및 인프라 도입 철회
          - **[병원 매핑 어드민]** 프론트 개발자와 협업하여 고객사-공공데이터 병원 매핑 어드민 구축, Spring Batch 기반 일일 공공데이터 수집 및 신규/폐업 의원 자동 감지
          - **[검색 튜닝 어드민]** 검색엔진 파라미터 변경 효과를 배포 없이 검증할 수 있는 샌드박스 도구 풀스택 개발 (React/TypeScript + Spring Boot)
      - layout: left
        title: Dreamfora
        sub_title: 모바일 App 개발 리드
        caption: 2019.04 - 2023.05
        description: |
          - **[아키텍처 설계]** 글로벌 목표관리 앱 'Dreamfora' Android/iOS 크로스플랫폼 아키텍처 설계 및 개발
          - **[안정성 개선]** 프로젝트 전체 리팩토링을 통한 크래시 레이트 개선 (2%대 → 0.1%대, 다수 이슈 해결을 통한 점진적 감소)
          - **[UX 개선]** 글로벌 6개 국어 대응 및 주요 흐름 레이아웃 Pre Loading 적용으로 사용자 체감 성능 향상
          - **[큐레이팅 어드민]** 사내 콘텐츠 관리 어드민 개발 (Next.js, React, TypeScript, Prisma)
  - title: 주요 프로젝트 상세
    layout: list
    content:
      - layout: left
        border: weak
        title: 검색엔진 자체 구축 및 무중단 마이그레이션
        caption: Elasticsearch, Docker, Spring Boot, Kibana
        description: |
          **개요**: 병원/약국 검색 서비스용 Elasticsearch 클러스터 자체 인프라 구축 및 마이그레이션

          **상황 및 목표**  
          기존 검색 서비스는 NCP PaaS(Search Engine Service)를 사용 중.  
          한글 형태소 분리 기능의 부재로 "이정배 소아청소년과"를 "이정배소아"처럼 띄어쓰기 없는 검색어에서 검색되지 않는 문제 발생.  
          NCP PaaS의 제약(ES 버전 7.7.0 고정, 플러그인 등 설치 시 기술지원 중단)으로 자체 인프라 구축 전환 결정.  

          **행동**
          - Docker 기반 3-Node 클러스터 구축 및 운영 가시성 확보를 위한 노드별 독립 Kibana 배치
          - 전국 병원/약국 데이터 볼륨을 고려하여 1 Primary Shard / 2 Replicas 구조 채택. 불필요한 분산 조회(Scatter-Gather) 오버헤드를 원천 차단하여 검색 레이턴시(p95) 방어
          - 무중단 마이그레이션: RDBMS를 Source of Truth로 두는 Dual-Write 전략 채택. 1주일간 신/구 검색엔진에 동시 요청(Shadowing)을 보내 랭크 및 레이턴시 비교 검증을 완료하고, 롤백 가능성을 확보한 상태에서 상용 트래픽 전환
          - Nori 한글 형태소 분석기 연동 및 커스텀 동의어 사전(진료과목 약어 등)을 적용하여 인덱스 맵핑 구성 완료

          **결과**
          - 상용 서비스 사용자 영향 없이 다운타임 0초로 무중단 마이그레이션 완수
          - 즉시 활용 가능한 형태소 기반 텍스트 분석 인프라 확보

      - layout: left
        border: weak
        title: Kafka 도메인 분할 및 관심사 재정의를 통한 이벤트 파이프라인 최적화
        caption: Kafka, Spring Boot, MySQL
        description: |
          **개요**: MSA 환경 내 이기종 시스템 간(EMR-PHR) 메시지 전파 아키텍처 개선

          **상황 및 목표**  
          고객사 시스템의 의원 정보 변경 시 Kafka를 통해 PHR 시스템으로 동기화하는 구조.  
          단일 토픽 구조로 인해 특정 정보(진료 대기 인원) 변경 시 무관한 리소스(병원/진료실 정보 등)까지 중복 수신.  
          진료 대기 인원의 미세한 변동이 수시로 DB Write 연산을 유발하여, 유의미하지 않은 데이터 동기화 반복.  
          도메인 중심의 전파 구조로 변환 필요.

          **행동**
          - 토픽 도메인 분할: 컨슈머 단의 단순 필터링에 의존하지 않고, 토픽 자체를 5개 물리적 도메인(진료인원, 병원정보 등)으로 격리. 각 마이크로서비스가 필요한 정보만 선별적으로 구독하도록 시스템 강결합 해소
          - 관심사 재정의: 이벤트 발행 빈도를 근본적으로 제어하기 위해, 비즈니스 요건을 분석하여 관심사를 '진료 대기 인원(명)'에서 **'예상 진료 대기시간(분)'**으로 전환. 유의미한 시간 임계치 변동 시에만 이벤트를 발행하도록 프로듀서 로직 고도화

          **결과**
          - 불필요한 동기화 이벤트 99% 감소, 연관 DB 갱신 96% 축소
          - 도메인 분리로 신규 서비스 추가 시 기존 구독자에 영향 없는 유연한 구조 확보

      - layout: left
        border: weak
        title: Kafka Broadcast를 활용한 실시간 무중단 캐시 동기화
        caption: Kafka, Spring Boot
        description: |
          **개요**: 다중 인스턴스 환경에서 실시간 로컬 캐시 일관성 보장 구조 설계

          **상황 및 목표**  
          해당 조회 서비스는 읽기 요청이 많고 갱신 빈도가 적은 기초 정보(코드값 등) 서비스.
          각 인스턴스 실행 시점에 DB에서 데이터를 로컬 캐시에 일괄 로드하여 응답.
          런타임 데이터 갱신시, 동기화 할 수단이 없어 매번 전체 인스턴스 순차 재시작하는 운영 비효율 발생.

          **행동**
          - 데이터 갱신 처리를 수행한 인스턴스가 변경 이벤트를 Kafka로 발행하도록 설계.  
          - 토픽을 단일 파티션으로 구성하고, 컨슈머 그룹의 모든 인스턴스가 직접 할당받아 동일 메시지를 각각 소비하도록 브로드캐스트 패턴 적용  
          - 트레이드오프 분석: 변경 사실만 전달하는 Zero-Payload 방식 적용 시, 수신 시점에 동시에 DB를 재조회하여 Thundering Herd 예측 -> 변경값을 페이로드에 함께 전파하도록 구성  

          **결과**
          - 매 갱신마다 발생하던 조회 인스턴스 전체 롤링 재시작(3분) 프로세스 완전 제거  
          - DB 커넥션 병목 없이 수 초 내에 전 인스턴스의 캐시 일관성을 확보하는 무중단 동기화 환경 구축

      - layout: left
        border: weak
        title: 상용 로그 시뮬레이션 기반 캐시 도입 철회 및 장애 격리
        caption: Caffeine, Redis, Spring Boot
        description: |
          **개요**: 외부 주소 API 응답 지연으로 인한 타임아웃 전파 방어 전략 수립

          **상황**
          외부 주소 API에서 간헐적 응답 지연 시 시스템 전반에 타임아웃 에러 전파 발생.

          **행동**
          - 아키텍처 설계 및 PoC: 외부 API 호출 최소화를 목표로 Caffeine(Local) + Redis(Global) 2계층 캐시 아키텍처 설계. 
          - 데이터 기반 검증: 인프라 도입 전 실효성을 객관적으로 판단하기 위해, 1주일 치 상용 검색 로그를 추출하여 자체 작성한 시뮬레이터에 투입
          - 도입 철회 결정: 시뮬레이션 결과 전국 단위 고객사 지역 분포 특성상 동일 검색어의 반복 빈도가 낮아 Cache Hit Rate가 20% 미만으로 도출됨. 이를 근거로 효용성이 낮음을 수치로 증명하고 캐시 인프라 도입 철회

          **결과**
          - 직관이 아닌 객관적 데이터 증명으로 불필요한 인프라 투자 및 오버엔지니어링 방지
          - 문제의 본질인 "장애 전파 차단"에 집중하여 Circuit Breaker(Resilience4J) 기반의 API 격리 및 백업 주소 API로의 Fallback 적용

      - layout: left
        title: 검색엔진 파라미터 튜닝 검증 도구 개발
        caption: React, TypeScript, Spring Boot, Elasticsearch
        description: |
          **개요**: 검색엔진 파라미터 변경의 효과를 배포 없이 검증할 수 있는 어드민 도구 개발

          **상황 및 목표**  
          Elasticsearch 검색 품질 개선 시, 파라미터(가중치, 분석기 설정 등) 변경마다 배포가 필요하여 빠른 실험이 어려움.  
          기획팀과 검색팀이 검색 결과 변동을 직관적으로 확인할 수단이 부재.  

          **행동**
          - 검증환경에 상용 데이터를 미러링하여, 파라미터 변경을 배포 없이 즉시 반영할 수 있는 샌드박스 환경 구성  
          - 300~500개 검색어를 동시 요청하여 현행 상용 검색 결과와 튜닝 후 결과의 랭크 변동을 자동 비교하는 대시보드 개발 (React/TypeScript)  
          - 주요 고객사 병원의 검색 순위 변동을 초록색/빨간색으로 시각화하여 기획팀이 즉시 판단 가능하도록 구성  
          - 프론트엔드(React/TypeScript)와 백엔드(Spring Boot) 모두 직접 구현

          **결과**  
          - 기획팀과 검색팀이 배포 없이 파라미터 튜닝 아이디어를 즉시 검증할 수 있는 환경 확보  
          - 검색 품질 개선 의사결정의 근거를 정성적 판단에서 데이터 기반 비교로 전환

