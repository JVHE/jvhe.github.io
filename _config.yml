  - title: 주요 프로젝트 상세
    layout: list
    content:
      - layout: left
        title: 검색엔진 마이그레이션 및 성능 고도화
        sub_title: 자체 인프라 구축을 및 무중단 마이그레이션
        caption: Elasticsearch, Docker, Spring Boot, Kibana
        description: |
          **프로젝트 개요**: 병원 검색 서비스의 전체 데이터를 NCP PaaS(Search Engine Service)에서 VPC에 Elasticsearch 클러스터 직접 구축 및 마이그레이션  
          
          **문제**: "이정배 소아청소년과"를 "이정배소아"와 같은 띄어쓰기 없는 검색 실패 문제 발생. NCP PaaS(Elasticsearch 7.7.0)의 버전 제한 및 플러그인 직접 설치시 기술지원 불가 정책 등의 제약으로 검색 품질 개선 어려움
          
          **해결**:  
            * Docker를 활용한 **3-Node Elasticsearch 클러스터 직접 구축** (Master-Slave 구조) 및 **병렬 운영을 활용한 검증 및 무중단 트래픽 전환**  
            * Nori 형태소 분석 플러그인 설치로 한글 검색 품질 개선  
            * Elasticsearch 파라미터 조작 및 검색어 수백 개를 동시에 요청·비교하는 튜닝 어드민 개발로 가중치 실험 효율 개선  
          
          **성과**: 한글 검색 정확도 대폭 향상 및 검색 튜닝 업무 효율성 개선  

      - layout: left
        title: Kafka 이벤트 기반 병원 정보 동기화 아키텍처 개선
        sub_title: 데이터 일관성을 유지하며 서버 부하 96% 감소
        caption: Kafka, Spring Boot, MySQL
        description: |
          **프로젝트 개요**: 병원 정보 동기화 시스템의 Kafka 이벤트 토픽 분리 및 처리 구조 개선  
          
          **문제**: 일관성을 위한 단일 이벤트 소스 기반 Zero-Payload 정책으로 일관성은 보장되었으나, 운영 중 예상 진료대기시간 등 기능 추가로 진료 대기인원 변경 시에도 이미지 호출 등 불필요한 리소스 재호출 발생 (일평균 이벤트 1,400건)
          
          **해결**:  
            * 단일 토픽을 관심사(진료 대기 인원, 서비스 구독, 병원정보, 설정 변경 등)에 따라 **5개 토픽으로 분리 설계**  
            * 관심사를 '진료 대기 인원'에서 '진료 예상 대기시간'으로 전환하고, 구간으로 분리하여 불필요한 이벤트 발생 억제  
          
          **성과**: **병원 정보 변경 이벤트 1,400건 → 15건 (99% 감소)**, **DB 업데이트 쿼리 3,500회 → 150회 (96% 감소)** (8월 3주차 vs 9월 3주차 비교), 데이터 일관성 유지하며 서버 자원 소모량 안정화

      - layout: left
        title: 분산 환경에서의 데이터 정합성 보장 로직 구현
        sub_title: Kafka 브로드캐스트를 활용한 고성능 일관성 유지
        caption: Kafka, Spring Boot, Java (AtomicReference)
        description: |
          **문제**: Kubernetes 환경에서 특정 Pod를 지정해 갱신할 수 없는 구조로, 다중 인스턴스 환경에서 데이터 변경 시 인스턴스 간 캐시 불일치 문제 발생
          
          **해결**:  
            * **Kafka 브로드캐스트 방식**: 컨슈머 그룹 내 모든 인스턴스가 동일 메시지를 소비하도록 구현하여 변경 사항(CUD)을 전체 인스턴스에 전파 (Hazelcast, Redis Pub/Sub 대신 기존 인프라 활용)  
            * 유효 기간이 겹치는 경우 수정일시 기준 최신 값 선택 로직 구현  
            * **AtomicReference**: 단일 인스턴스 내에서 동시 조회 요청 시 메모리에 로딩된 코드값의 일관성 보장 (Lock-free 방식)  
          
          **성과**: 읽기 부하가 높은 상황에서도 시간대별 일관된 데이터 응답 보장 및 서비스 신뢰도 확보

      - layout: left
        title: Elasticsearch 기반 병원/약국 검색 서비스 구축
        sub_title: 공공데이터 기반 고성능 검색 시스템 구축
        caption: Elasticsearch, Spring Batch, Spring Boot
        description: |
          **주요 업무**:  
            매일 자정 국립중앙의료원 공공데이터를 수집/가공하여 인덱싱하는 배치 파이프라인 구축  
            병원/약국 검색, 찜 기능 개발(진료과목, 영업 여부 필터 등)  
            **LCS(Longest Common Subsequence) 알고리즘**을 활용한 신규 병원과 기존 데이터 간 유사도 검증 프로세스 구현 (전화번호, 주소, 병원명의 공백/특문 차이 고려, 유사도 80% 전후에서 유의미한 결과)
          
          **성과**: 공공데이터 기반 검색 시스템 구축 및 중복 병원 노출 최소화를 통한 검색 품질 향상
          

      - layout: left
        title: 운영 효율화를 위한 백오피스(Admin) 개발, 동기화 예약 기능 추가
        sub_title: 수동 업무를 웹 UI로 자동화하여 운영 효율성 향상
        caption: Spring Boot, Spring Security
        description: |
          **주요 업무**:  
            * 부가서비스 가입 병원 매핑 및 관리 기능 구현 (기존 수동 DB 조작 업무를 웹 UI로 자동화)  
            * 신규 개원의원을 공공데이터 반영 전 클레 검색에 노출할 수 있는 병원생성 기능 개발  
            * 개원일자에 맞춘 노출 예약 기능으로 운영팀의 업무 유연성 확보  
          
          **문제 해결**: 초기 사용법 설명 세션에서 기능 중심 설명으로 인한 이해도 저하 → 사용 흐름 중심 문서화 및 교육 자료 제공으로 개선  
          
          **성과**: 안전하고 편리한 병원 매핑 프로세스 구축, 실수 위험 제거 및 작업 효율성 향상

      - layout: left
        title: 주소 검색 MSA 캐시 전략 도입 검토 및 구현
        sub_title: 2계층 캐시 전략 시뮬레이션 및 성능 검증
        caption: Caffeine, Redis, Spring Boot
        description: |
          **문제**: EMR 필드의 address_search MSA에서 정부 API(juso.go.kr) 중복 호출로 인한 비용 문제 발생  
          
          **접근**:  
            * 1주일치 검색 결과 9만건 분석 결과, 대도시/시군구 중심의 중복 호출 패턴 확인  
            * Caffeine(Local) + Redis(Global) 2계층 캐시 전략 도입
            * 버킷 수 및 TTL 변경 등 캐시정책에 따른 시뮬레이션 코드 작성 및 성능 검증
          
          **결과**: 서버 캐시 히트율 20%대 확인. 지역성이 강한 EMR 특성 상, 서버측에서 주소 캐시 정책은 유의미하지 않음을 확인

      - layout: left
        title: Dreamfora 모바일 클라이언트 개발
        sub_title: 글로벌 100만 유저 서비스의 클라이언트 최적화 및 기능 구현
        caption: Xamarin.Forms (C#), Swift, SQLite, MVVM
        description: |
          **V1 & V2 개발 (2019.04 - 2022.02)**:
            * MVP 프로젝트 인수 후 혼자서 약 2년간 개발 및 유지보수
            * Cross-platform framework인 Xamarin.Forms를 이용하여 Android, iOS 동시 개발 및 런칭
            * 목표 관리, 목표 추천, 수행 기록 및 통계, 백업 및 동기화, 소셜 로그인, 다국어화, 애니메이션 등 전반적인 기능 구현
            * MVVM 패턴 적용 및 필요한 Bindable Property 직접 구현
            * Notification, Social Login, Data Sync 로직을 Project 단위로 분리하여 코드 간 의존성 감소
            * Custom Layout, Custom Renderer를 사용하여 Xamarin에서 제공하지 않는 View를 기획/디자인 요구사항에 맞게 구현
            * 테마 시스템 구현으로 같은 기능을 다른 UI 구성으로 제공
          
          **iOS Native 전환 (2022.01 - 2022.08)**:
            * Swift/SwiftUI 기반으로 iOS Native 전환 프로젝트 참여
            * 설계, 로직, 소셜 로그인 담당
          
          **Feed Admin (2022.09 - 2023.04)**:
            * 게시글 검색/정렬/필터링, 사용자 이용제한 기능 등 구현
            * Next.js 기반 백오피스 개발

