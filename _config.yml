        caption: 2023.07 - 2024.12
        quote: >
          클라우드 네이티브 환경의 EMR(전자 의료 기록), PHR(개인 건강 기록) 서비스 백엔드 고도화 및 검색 엔진 구축
        description: |
          **이벤트 기반 동기화 구조 개선**: 단일 이벤트 소스 기반 일관성 보장 정책에서 운영 중 기능 추가로 인한 리소스 낭비를 해결하기 위해 관심사별 5개 토픽으로 분리하여 **DB 부하 96% 절감** (일평균 3,500회 → 150회)   
          **인프라 자립화 및 검색엔진 마이그레이션 수행**: NCP PaaS의 제약을 극복하기 위해 Elasticsearch 클러스터 직접 구축, 무중단 마이그레이션 수행  
          **검색 품질 고도화**: Nori 형태소 분석기 도입 및 가중치 실험 자동화를 위한 튜닝 어드민 개발로 검색 품질 개선  
          **분산 데이터 일관성 보장**: k8s multi pod 환경에서 Kafka 브로드캐스트 방식으로 다중 인스턴스 간 일관성 유지

