  - title: 주요 프로젝트 상세
    layout: list
    content:
      - layout: left
        border: weak
        title: 검색엔진 마이그레이션 및 성능 고도화
        sub_title: 자체 인프라 구축 및 무중단 마이그레이션
        caption: Elasticsearch, Docker, Spring Boot, Kibana
        description: |
          **개요**: 병원/약국 검색 데이터를 NCP PaaS에서 VPC에 Elasticsearch 클러스터 직접 구축 및 마이그레이션  
          
          **상황**:  
          - 병원 검색시 "이정배 소아청소년과"를 "이정배소아"처럼 띄어쓰기 없는 검색어 적용시 실패 문제 발생(한글 형태소 분석 불가)  
          - NCP PaaS의 제약(ES 버전 7.7.0 고정, 플러그인 설치 시 기술지원 중단)으로 고품질 검색 서비스 제공 불가
          
          **목표**: 검색 서비스 품질 한계 극복 및 자체 인프라 전환을 통한 운영 자립화

          **행동**
          - Docker 기반 **3-Node ES 클러스터 직접 구축** (Master-Data 구조) 및 **Dual-Write 전략** 마이그레이션
          - 데이터 마이그레이션 및 이중 배포 후 1주일 간 기존 검색엔진과 신규 검색엔진에 동시 요청 및 비교하여 일치 여부 관찰
          - 한글 형태소 분석 플러그인(Nori Analyzer) 설치
          - 검색 성능 개선을 위한 어드민 개발
            - 주요 고객사를 위한 검색어 맞춤형 동의어 사전 적용(예: 진료과목 약어, 병원명 축약어 등)
            - 가중치 동적 튜닝 및 변경 전후 일괄 랭크 비교 기능 구현
    
          **결과**
          - 검색 품질 고도화 기반 마련
          - 상용 서비스 무중단 마이그레이션 완수

      - layout: left
        border: weak
        title: Kafka 기반 병원 정보 동기화 구조 개선
        sub_title: 토픽 및 관심사 분리를 통한 DB Write 부하 96% 절감
        caption: Kafka, Spring Boot, MySQL
        description: |
          **개요**: 병원 정보 동기화 시스템의 Kafka 이벤트 토픽 분리 및 처리 구조 개선  
          
          **상황**: 단일 이벤트 소스 구조에서, 운영하며 추가된 다양한 기능으로 인해 단일 이벤트 토픽의 과도한 의존 상황 발생  
          진료 대기인원 등의 변경에도 이와 무관한 리소스(병원정보, 진료실 정보 등)를 함께 수신하며 불필요한 DB 부하 유발 (일 3,500회 쿼리)  
          
          **목표**: DB 업데이트 부하 절감 및 이벤트 전파 구조 최적화
          
          **행동**
          - 단일 토픽을 관심사(진료인원, 병원정보, 설정 등)에 따라 5개로 분리하여 전파 범위 최적화  
          - 관심사를 ‘진료 대기 인원’에서 ‘진료 예상 대기시간’으로 전환하고, 구간으로 분리하여 불필요한 이벤트 발생 억제  
          
          **결과**
          - 데이터 신뢰성을 유지하며 DB 업데이트 부하 96% 절감 (일평균 3,500회 → 150회)  
          - 병원 정보 변경 이벤트 1,400건 → 15건 (99% 감소)  

      - layout: left
        border: weak
        title: 분산 환경 캐시 일괄 동기화
        sub_title: Kafka 브로드캐스트
        caption: Kafka, Spring Boot
        description: |
          **개요**: Kubernetes 다중 인스턴스 환경에서 데이터 변경 시 캐시 일관성 보장 구조 설계  
          
          **상황**  
          해당 조회 서비스는 인스턴스 실행 시점에 DB에서 코드값을 메모리에 로드하여 응답.  
          데이터 변경 시 모든 인스턴스의 캐시를 갱신하기 위해 매번 전체 인스턴스를 재시작하는 비효율적 운영 발생  
          
          **목표**: 재시작 없이 실시간 동기화 및 일관된 데이터 응답 보장
          
          **행동**  
          - **Kafka 브로드캐스트**: 컨슈머 그룹 내 모든 인스턴스가 동일 메시지를 소비하도록 수동 파티션 할당 방식으로 구현하여 변경 사항(CUD)을 전체 인스턴스에 전파  
          - **기술 선택 이유**: Hazelcast, Redis Pub/Sub, debezium 등 다양한 대안 검토 후, 기존 인프라(Kafka)를 활용하여 추가 인프라 비용/공수 최소화  
          - **Zero-Payload 메시징**: 메시지 도착 시 DB에 조회를 하는 구조로, 메시지 손실/중복 상황에서도 일관성 보장  
          - **AtomicReference**: Lock-free 방식으로 단일 인스턴스 내에서 동시 조회 요청 시 메모리에 로딩된 코드값의 일관성 보장  
          
          **기여 성과**  
          - 재부팅 대기 없이 실시간 동기화 달성 (수 초 내 반영)
          - 읽기 부하가 높은 상황에서도 시간대별 일관된 데이터 응답 보장
      - layout: left
        title: 주소 검색 MSA 캐시 전략 검증 및 리소스 최적화
        sub_title: 데이터 기반 시뮬레이션을 통한 무분별한 인프라 도입 방지
        caption: Caffeine, Redis, Spring Boot
        description: |
          **개요**: 외부 주소 API 응답 지연 문제 해결을 위한 캐시 도입 검증 및 시뮬레이션 수행
          
          **상황**  
          외부 주소 API 응답 지연 시 시스템 전반에 타임아웃 에러 전파 발생  
          캐시 도입 및 장애 대응 방안 필요성 대두
          
          **목표**: 장애 전파 방지와 성능 개선을 위한 캐시 도입 검토  
          **역할**: 기술 구현 가능성 검토 및 시뮬레이션 수행 담당  
          
          **행동**  
          - **데이터 분석**: 1주일치 검색 로그(9만 건)를 추출하여 중복 패턴 분석. 중복 카운트 제거 결과, 고유 검색어가 약 3만개 아래로 감소 (약 70% 중복) 확인  
          - **기술 구현**: Caffeine(Local) + Redis(Global) 2계층 캐시 아키텍처 설계 및 PoC 구현  
            - 1) Local 캐시: Caffeine 사용, 인스턴스 내 초고속 응답 처리  
            - Global 캐시 만료 시점에 Local 캐시 동시 제거 정책 적용으로 데이터 정합성 확보  
            - 2) Global 캐시: Redis 사용, 다중 인스턴스 간 캐시 일관성 보장  
            - 캐시 정책 수립: TTL(Time-To-Live) 설정, 버킷 수 결정 등 다양한 캐시 정책 수립  
          - **시뮬레이션**: 캐시 시뮬레이션 코드 작성 및 히트율 측정. 버킷 수 및 TTL 변경 등 캐시정책에 따른 시뮬레이션 수행  
          **의사결정**  
          - 분석 결과 히트율이 20%에 불과하여, **캐시 도입 비용(개발 공수, 인프라 비용 + 데이터 정합성 관리 공수)이 성능 이득보다 크다고 판단.**
          
          **기여 성과**  
          근거 없는 기술 도입을 방지하여 **개발/운영 리소스 낭비를 차단**하고, 대신 타임아웃 설정 최적화 및 서킷 브레이커 도입 등으로 방향을 선회하는 계기 마련. 데이터 기반의 사전 검증을 통해 불필요한 인프라 비용과 운영 리소스를 방지.
