about_content: |
  시스템의 병목을 데이터로 증명하고, 비용과 성능을 최적화하는 백엔드 개발자 이정배입니다.    
  
  6년간 모바일 클라이언트부터 백엔드 인프라까지 서비스의 전 계층을 경험하며, 기술적 제약을 비즈니스 기회로 전환하는 데 집중해 왔습니다.    
  
  **성능 최적화**: **Kafka 이벤트 토픽 분리**로 DB 업데이트 쿼리 96% 감소 (3,500회 → 150회)  
  **인프라 자립화**: **Docker 기반 Elasticsearch 클러스터** 직접 구축, 무중단 마이그레이션 완수  
  **시스템 안정성**: 분산 환경에서 **Kafka 브로드캐스트 + AtomicReference**로 Lock-free 동시성 제어, 실시간 데이터 일관성 보장    

