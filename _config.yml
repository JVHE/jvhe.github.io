about_content: |
  **문제를 집요하게 추적하고, 원인을 구조적으로 제거하는 과정에서 보람을 느끼는 개발자 이정배입니다.**  
  
  100만 유저 규모의 앱 서비스 개발부터 백엔드 전환까지 경험하며, 단순한 기능 구현보다 **'재발하지 않는 근본적인 해결책'**을 찾는 데 집중해 왔습니다.  
  
  백엔드 개발자로 이직 후 SpringBoot 기반 MSA 환경에서 EMR, PHR 서비스 개발을 하며 Kafka 기반 이벤트 처리, Elasticsearch 검색엔진 구축/운영 등 다양한 백엔드 기술을 다뤘습니다.  
  
  특히, **병원/약국 검색 시스템의 무중단 마이그레이션**과 **이벤트 정밀도 최적화를 통한 불필요한 DB Write 96% 절감** 등 시스템 안정화와 운영 효율화에 기여했습니다.  
  
  기술 도입의 화려함보다 **데이터 기반의 객관적 분석**을 우선시하며, 문제의 본질을 해결하여 비즈니스의 성장을 뒷받침합니다.  

content:
  - title: 경력 사항
    layout: list
    content:
      - layout: left
        title: Cenacle
        sub_title: 백엔드 개발(서비스개발 1팀)
        caption: 2023.07 - 2024.12
        description: |
          - 병원/약국 검색엔진 구축 및 무중단 마이그레이션(Elasticsearch 자체 클러스터 운영)  
          - EMR(전자 의료 기록) - PHR(개인 건강 기록) 간 병원 정보 동기화 시스템 개발 및 고도화  
          - Kafka 기반 이벤트 처리 아키텍처 개선으로 DB Write 96% 감소(일 3,500회 → 150회)  
          - Kafka Broadcast를 활용한 실시간 캐시 동기화 및 운영 효율 개선
      - layout: left
        title: Dreamfora
        sub_title: 모바일 App 개발 및 유지보수
        caption: 2019.04 - 2023.05
        description: |
          - 중장기 목표관리 어플리케이션 'Dreamfora' Android/iOS 앱 개발 및 유지보수
          - 주요 기능: 목표 설정/관리, 습관 형성, 알림, 통계, 다국어, 애니메이션, 테마, 커뮤니티 등
          - 백오피스 관리 시스템 개발: 커뮤니티, 사용자 관리, 큐레이팅 콘텐츠 관리 등

      - layout: left
        title: UNIST (울산과학기술원)
        sub_title: Computer Science Engineering(주) / Mathematical Sciences(부)
        caption: 2013.03 - 2019.02
        description: |
          - 졸업 프로젝트: LSQUIC(QUIC 프로토콜) Android 이식 프로젝트 수행  
          - 연구 인턴십: Hadoop 인메모리 캐시 시뮬레이터 개발, CUDA 프로그래밍 경험
  - title: 기술 역량
    layout: list
    content:
      - layout: text
        sub_title: 프레임워크
        description: |
          Spring Boot(Java), Spring Batch, JPA/Hibernate
      - layout: text
        sub_title: 데이터베이스
        description: |
          MySQL, Elasticsearch, Redis
      - layout: text
        sub_title: 메시징 & 캐시
        description: |
          Kafka: 이벤트 기반 아키텍처 설계, Redis/Caffeine: 2계층 캐시 설계 및 구현
      - layout: text
        sub_title: 검색 엔진
        description: |
          Elasticsearch: 클러스터 구축 및 배치를 포함한 검색엔진 운영
  - title: 주요 프로젝트 상세
    layout: list
    content:
      - layout: left
        border: weak
        title: 검색엔진 마이그레이션 및 성능 고도화
        sub_title: 자체 인프라 구축 및 무중단 마이그레이션
        caption: Elasticsearch, Docker, Spring Boot, Kibana
        description: |
          **개요**: 병원/약국 검색 서비스용 Elasticsearch 클러스터 직접 구축 및 마이그레이션  
          
          **상황**  
          당시 검색서비스는 Naver Cloud Platform의 Search Engine Service(PaaS)를 사용 중
          한글 형태소 분리 기능의 부재로 "이정배 소아청소년과"를 "이정배소아"처럼 띄어쓰기 없는 검색어에서 검색되지 않는 문제 발생    
          NCP PaaS의 제약(ES 버전 7.7.0 고정, 형태소 플러그인 등 설치 시 기술지원 중단)으로 **PaaS 사용 이점 상실**  
          
          **목표**: 검색 서비스 품질 한계 극복 및 자체 인프라 전환을 통한 운영 자립화

          **행동**
          - **인프라 자립**: Docker 기반 3-Node 클러스터 구축 및 운영 가시성 확보를 위한 노드별 독립 Kibana 배치
          - **샤드 전략 최적화**: 11만 건의 데이터 규모에 맞춰 **1 Primary Shard / 2 Replicas** 구조 채택. 오버 샤딩에 따른 리소스 낭비를 방지/샤드 간 병합 과정 없는 검색 성능 확보  
          - **데이터 정합성**: RDBMS를 Source of Truth로 하는 **Dual-Write** 전략 마이그레이션 및 1주일간 신/구 검색엔진 동시요청 및 랭크 비교 검증 수행  
          - **검색 품질 개선**: 한글 형태소 분석기(Nori) 및 동의어 사전 적용(진료과목 약어, 병원명 축약어 등)으로 검색 재현률 향상  
    
          **결과**
          - 상용 서비스 무중단 마이그레이션 및 검색 품질 고도화 기반 마련

      - layout: left
        border: weak
        title: Kafka 이벤트 노이즈 제거로 DB Write 96% 감소
        caption: Kafka, Spring Boot, MySQL
        description: |
          **개요**: 병원 정보 동기화 시스템의 메시지 전파 구조를 개선하여 시스템 자원 낭비 최소화  
          
          **상황**  
          단일 이벤트 토픽 구조로 인해 특정 정보(진료 대기 인원) 변경 시 무관한 리소스(병원/진료실 정보 등)까지 중복 수신  
          진료 대기 인원의 미세한 변동이 수시로 DB Write 연산을 유발하여, 유의미하지 않은 데이터 동기화 반복  
          
          **목표**: 이벤트 노이즈 제거 및 도메인 중심의 데이터 전파 전략 수립
          
          **행동**
          - 단일 토픽을 5개의 관심사(진료인원, 병원정보, 설정 등)로 분리하여 각 서비스가 필요한 정보만 선별적으로 구독하도록 개선  
          - 관심사를 '진료 대기 인원'에서 '진료 예상 대기시간'으로 전환하여 불필요한 이벤트 발생 억제  
          
          **결과**
          - 데이터의 정합성을 유지하며 **불필요한 DB Write 연산 96% 제거** (일평균 3,500회 → 150회)  
          - 병원 정보 변경 **이벤트 99% 감소** (일평균 1,400건 → 15건)  
          - 전파 범위 최적화를 통해 서비스 간 결합도를 낮추고 메시징 비용 절감

      - layout: left
        border: weak
        title: Kafka Broadcast를 활용한 실시간 캐시 동기화 및 운영 효율 개선
        caption: Kafka, Spring Boot
        description: |
          **개요**: 다중 인스턴스 환경에서 Zero-Payload 기반의 실시간 캐시 일관성 보장  
          
          **상황**  
          해당 조회 서비스는 **읽기 요청이 매우 많고, 갱신 빈도가 적은 서비스**(기초 정보)  
          인스턴스 실행 시점에 DB에서 코드값을 로컬 캐시에 **일괄 로드하여 응답**  
          로컬 캐시 동기화 수단 부재로 캐시를 갱신하기 위해 매번 전체 **인스턴스를 재시작하는 운영 비효율 발생**  
          
          **목표**: 재시작 없는 실시간 동기화 및 일관된 데이터 응답 보장
          
          **행동**  
          - **Kafka 브로드캐스트 튜닝**: 컨슈머 그룹 내 모든 컨슈머가 동일 메시지를 각각 소비하도록 일괄 파티션 할당 방식으로 구현하여 변경 사항(CUD)을 전체 인스턴스에 전파  
          - **기술 선택 이유**: Hazelcast, Redis Pub/Sub, debezium 등 다양한 대안 검토 후, 기존 인프라(Kafka)를 활용하여 추가 인프라 비용/공수 최소화  
          - **Zero-Payload 메시징**: 메시지 도착 시 DB에 조회를 하는 구조로, 메시지 손실/중복 상황에서도 일관성 보장  
          - **AtomicReference**: Lock-free 방식으로 단일 인스턴스 내에서 동시 조회 요청 시 메모리에 로딩된 코드값의 일관성 보장  
          
          **결과**  
          - **Zero-Downtime 기반의 설정 동기화** 구축: 전체 인스턴스 순차 재시작(3분) 없이 수 초 내 전 인스턴스 데이터 일관성 확보
          - 읽기 부하가 높은 상황에서도 시간대별 일관된 데이터 응답 보장
      - layout: left
        title: 주소 검색 서비스 캐시 전략 수립 및 PoC
        sub_title: 데이터 기반 시뮬레이션을 통한 불필요한 인프라 도입 방지
        caption: Caffeine, Redis, Spring Boot
        description: |
          **개요**: 외부 주소 API 응답 지연으로 인한 장애 전파 리스크 해결을 위한 캐시 도입 검토
          
          **상황**  
          외부 주소 API 응답 지연 시 시스템 전반에 타임아웃 에러 전파 발생  
          캐시 도입 및 장애 대응 방안 필요성 대두
          
          **목표**: 장애 전파 방지와 성능 개선을 위한 캐시 도입 검토  
          **역할**: 캐시 기능 구현 및 효용성 검토 담당  
          
          **행동**  
          - **기술 구현**: Caffeine(Local) + Redis(Global) 2계층 캐시 아키텍처 설계 및 PoC 구현  
            - 1) Local 캐시: Caffeine 사용, 인스턴스 내 초고속 응답 처리  
            - Global 캐시 만료 시점에 Local 캐시 동시 제거 정책 적용으로 데이터 정합성 확보  
            - 2) Global 캐시: Redis 사용, 다중 인스턴스 간 캐시 일관성 보장  
            - 캐시 정책 수립: TTL(Time-To-Live) 설정, 버킷 수 결정 등 다양한 캐시 정책 수립  
          - **분석 및 의사결정**  
            - **로그 기반 시뮬레이션**: 1주일치 검색 로그(9만 건, 중복 제외 3만건)를 추출하여 시뮬레이션 수행. Hit rate 예상치가 20% 미만임을 확인  
            - **비용 대비 효용 판단**: Redis 인프라 유지 및 데이터 정합성 관리 공수가 성능 이득보다 크다고 판단하여 **최종 도입 철회 결정**
          - **대안 제시**:
            - 지역 특성이 강한 주소 데이터 특성 상, 서버 캐시보다는 클라이언트 측 캐시 도입 검토 권고
            - 장애시 Circuit Breaker를 활용하여 대안용 주소 조회 API 반영 검토  
          
          **결과**  
          데이터 기반의 의사결정으로 개발/운영 리소스 낭비 원천 차단, 서킷 브레이커 도입 등으로 방향을 선회하는 계기 마련
  - title: 개인 프로젝트
    layout: list
    content:
      - layout: left
        border: weak
        title: LSQUIC for Android Implementation
        sub_title: QUIC 프로토콜 이해를 위한 저수준 라이브러리 포팅
        caption: JNI, Android NDK, C, QUIC, Wireshark
        link: https://github.com/JVHE/LSQUIC-for-android-implementation

        description: |
          **개요**: JNI를 활용하여 litespeedtech의 C 라이브러리를 Android NDK 환경에 이식  
          **상황**: 2018년 당시 Android에서 QUIC 프로토콜을 직접 이용할 수 있는 라이브러리 부재  
          **목표**: QUIC 프로토콜 동작 원리 이해 및 Android 환경에서 QUIC 통신 구현  
          **행동**: JNI 인터페이스 설계 및 NDK 빌드 스크립트 작성 및 네이티브 포팅, 브라우저 통신 라이브러리 교체로 QUIC 통신 적용 및 Wireshark를 통한 패킷 분석  
          **결과**: Android 환경에서 QUIC 프로토콜 통신 성공 및 TCP 대비 UDP 기반 통신 특성 이해
