about_content: |
  시스템의 병목을 데이터로 증명하고, 비용과 성능을 최적화하는 백엔드 개발자 이정배입니다.  
  
  6년간 모바일 클라이언트부터 백엔드 인프라까지 서비스의 전 계층을 경험하며, 기술적 제약을 비즈니스 기회로 전환하는 데 집중해 왔습니다.  
  
  **성능 최적화**: Kafka 이벤트 토픽 분리 및 비동기 처리 구조 개선을 통해 **DB 업데이트 쿼리 부하를 96% 감소**시킨 성과가 있습니다.  
  **인프라 주도권**: 클라우드 PaaS의 기술적 한계를 극복하기 위해 **Docker 기반 Elasticsearch 클러스터를 직접 구축**하고, 상용 서비스 중단 없는 마이그레이션을 완수했습니다.  
  **데이터 신뢰성**: 분산 환경에서 발생할 수 있는 데이터 정합성 문제를 Kafka와 Redis를 활용해 해결하는 등 안정적인 시스템 설계를 지향합니다.  

