about_content: |
  안드로이드에서 백엔드로 전환하며 스타트업 성장과 서비스 최적화를 경험한 백엔드 개발자 이정배입니다.  
  
  목표관리 앱 스타트업에 2번째 직원으로 합류하여 4인부터 12인까지, 출시부터 100만 유저 확보까지 견인했습니다. 사용자 증가에 따른 다국어, 성능 최적화 등 요구사항을 충족하는 개발을 진행하였고, 시스템 성능 최적화에 매력을 느껴 백엔드 엔지니어로 커리어를 확장했습니다.
  
  백엔드 엔지니어로 이직 후 클라우드 네이티브 MSA 환경에서 Kafka 기반 이벤트 처리, Elasticsearch 검색엔진 구축 등 백엔드 핵심 기술을 다뤘습니다.    
  
  최근 1년간 개인적인 재정비와 육아에 전념한 후, 최근 3개월 간 백엔드 부트캠프를 진행하며 현업 복귀를 위한 기술적 준비를 마쳤습니다.   

